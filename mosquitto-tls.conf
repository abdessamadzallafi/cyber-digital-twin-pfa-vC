# TLS listener — used only in production/deployment (not in local dev mode).
# Before enabling, generate certificates with scripts/gen_certs.sh
# and set the paths below to match your deployment environment.

listener 8883
cafile /path/to/certs/ca.crt
certfile /path/to/certs/server.crt
keyfile /path/to/certs/server.key
tls_version tlsv1.2
